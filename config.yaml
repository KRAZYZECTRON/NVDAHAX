# Shared config. Track B (vision) keys below; Tracks A/C add their own sections.

# --- Track B: camera ---
camera_index: 0          # try 1, 2 if the wrong camera opens (DroidCam is often 1)
camera_width: 1920       # drop to 1280x720 if FPS < 15
camera_height: 1080
camera_fps: 30
camera_exposure: -7      # DirectShow log2(seconds): -7 ~ 1/128 s, -8 ~ 1/256 s. null = leave auto
camera_focus: 0          # 0 = infinity on Logitech. null = leave autofocus on

# --- Track B: arena (MEASURE THESE) ---
arena_w_cm: 200.0        # centre of marker 1 -> centre of marker 2
arena_h_cm: 150.0        # centre of marker 1 -> centre of marker 4
camera_height_cm: 200.0  # lens -> floor
marker_height_cm: 10.0   # floor -> top surface of the rover marker
object_height_cm: 5.0    # ~half a typical demo object's height (parallax for YOLO points)

# --- Track B: tracker ---
calib_file: vision/camera_calib.npz
homography_file: vision/homography.npz
homography_drift_px: 3.0 # recompute homography if corner markers move more than this
pose_ema_alpha: 0.6      # 1.0 = no smoothing
pose_max_missed: 3       # get_pose returns None after this many frames without marker 0

# --- Track B: detector ---
yolo_model: yolov8n.pt
yolo_imgsz: 960
yolo_conf: 0.35
yolo_every_n: 1          # run YOLO every N frames (raise on CPU)
demo_labels: [cup, bottle, cell phone, scissors, book, remote, sports ball]
rover_exclude_cm: 12.0
object_match_cm: 15.0    # max move between frames to keep the same object id
object_max_age: 30       # frames an unseen object keeps its id
arena_margin_cm: 10.0    # drop detections this far outside the arena
